[project]
name = "ltx25-cli"
version = "0.1.0"
description = "Command-line runner for LTX-2.5 video generation on AMD ROCm (gfx1151)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch[device-gfx1151]==2.15.0+rocm10.2.0",
    "torchvision[device-gfx1151]==0.29.2+rocm10.2.0",
    "torchaudio==2.11.1+rocm10.2.0",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "huggingface-hub[cli]",
    "click",
    "pyyaml",
    "pillow",
    "imageio[ffmpeg]",
    "av",
    "psutil>=7.2.2",
]

[project.scripts]
ltx25 = "ltx25_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

# --- ROCm wheels -------------------------------------------------------------
# ROCm 10.2 uses the unified wheel index; the device extra selects gfx1151.
[[tool.uv.index]]
name = "rocm-gfx1151"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[tool.uv]
# ROCm runtime dependencies are distributed through the AMD index.
index-strategy = "unsafe-best-match"
prerelease = "allow"

[tool.uv.sources]
torch = { index = "rocm-gfx1151" }
torchvision = { index = "rocm-gfx1151" }
torchaudio = { index = "rocm-gfx1151" }
# LTX-2.5 is only supported on diffusers main; not in any tagged release yet.
diffusers = { git = "https://github.com/huggingface/diffusers" }
